  <script>

ingle-092", "type": "single", "number": 92, "text": "能帮助和支持可燃物燃烧的物质，即能与可燃物发生氧化反应的物质称为（  ）。", "options": {"A": "氧化剂", "B": "还原剂", "C": "引火源", "D": "催化剂"}, "answer": ["A"], "source": {"sheet": "单选题（201题）", "row": 94}}, {"id": "single-093", "type": "single", "number": 93, "text": "下列那些物质不能作为助燃物（  ）", "options": {"A": "氧气", "B": "氯气", "C": "氟气", "D": "氢气"}, "answer": ["D"], "source": {"sheet": "单选题（201题）", "row": 95}}, {"id": "single-094", "type": "single", "number": 94, "text": "明火焰是比较强的火源，火焰温度在（  ）之间，它可以点燃一般的可燃物质。", "options": {"A": "200～800℃", "B": "700～2000℃", "C": "500-800℃", "D": "800-1200℃"}, "answer": ["B"], "source": {"sheet": "单选题（201题）", "row": 96}}, {"id": "single-095", "type": "single", "number": 95, "text": "烟气在建筑物内沿垂直方向流动时，流速大约为（  ）。", "options": {"A": "1m／s", "B": "2m／s", "C": "3—5m／s", "D": "6m／s"}, "answer": ["C"], "source": {"sheet": "单选题（201题）", "row": 97}}, {"id": "single-096", "type": "single", "number": 96, "text": "从物质燃烧的过程来看，物质能够发生自燃的条件是（  ）。", "options": {"A": "物质氧化的放热速率大于散热速率", "B": "物质氧化的放热速率小于散热速率", "C": "物质氧化的放热速率等于散热速率", "D": "物质氧化的吸放热速率小于等于散热速率"}, "answer": ["A"], "source": {"sheet": "单选题（201题）", "row": 98}}, {"id": "single-097", "type": "single", "number": 97, "text": "爆炸性混合物，当（  ） 时，爆炸放出的热量最多，产生的压力最大。", "options": {"A": "处于爆炸浓度下限", "B": "处于爆炸浓度上限", "C": "可燃物质的浓度增加到稍高于化学计量浓度", "D": "可燃物质的浓度远远超过化学计量浓度"}, "answer": ["C"], "source": {"sheet": "单选题（201题）", "row": 99}}, {"id": "single-098", "type": "single", "number": 98, "text": "液体在燃烧过程中，不是液体本身在燃烧，而是液体受热时先蒸发为蒸气，蒸气受热后再发生（  ），温度达到自燃点再燃烧。", "options": {"A": "热分解、氧化", "B": "裂变", "C": "链引发", "D": "链传递"}, "answer": ["A"], "source": {"sheet": "单选题（201题）", "row": 100}}, {"id": "single-099", "type": "single", "number": 99, "text": "粉尘的颗粒度越小，相对面积越大，燃烧速度越快，爆炸下限（  ）。", "options": {"A": "越大", "B": "越小", "C": "越高", "D": "越低"}, "answer": ["D"], "source": {"sheet": "单选题（201题）", "row": 101}}, {"id": "single-100", "type": "single", "number": 100, "text": "车用汽油的闪点为-38℃，照明用煤油闪点为40℃，若将二者按1：1的比例混合，则混合物的闪点 （  ）。" 府规章", "D": "较大的市的人民政府规章"}, "answer": ["C"], "source": {"sheet": "单选题（201题）", "row": 110}}, {"id": "single-109", "type": "single", "number": 109, "text": "机关、团体、企业、事业等单位的主要负责人是本单位的（  ）。", "options": {"A": "消防安全管理人", "B": "消防安全责任人", "C": "消防工作归口管理部门负责人", "D": "消防安全监督人"}, "answer": ["B"], "source": {"sheet": "单选题（201题）", "row": 111}}, {"id": "single-110", "type": "single", "number": 110, "text": "国家综合性消防救援队、专职消防队扑救火灾、应急救援，（  ）。", "options": {"A": "可以视情收取费用", "B": "可以收取灭火损耗费用", "C": "不得收取任何费用", "D": "经单位自愿，可收取费用"}, "answer": ["C"], "source": {"sheet": "单选题（201题）", "row": 112}}, {"id": "single-111", "type": "single", "number": 111, "text": "进行电焊、气焊具有火灾危险作业的人员和（  ），必须持证上岗，并遵守消防安全操作规程。", "options": {"A": "消防安全管理人", "B": "防火巡查人员", "C": "自动消防系统的操作人员", "D": "消防值班人员"}, "answer": ["C"], "source": {"sheet": "单选题（201题）", "row": 113}}, {"id": "single-112", "type": "single", "number": 112, "text": "专职消防队的建立，应当符合国家有关规定，并报当地消防救援机构（  ）。", "options": {"A": "备案", "B": "审批", "C": "许可", "D": "验收"}, "answer": ["D"], "source": {"sheet": "单选题（201题）", "row": 114}}, {"id": "single-113", "type": "single", "number": 113, "text": "下列哪项不是《中华人民共和国消防法》所称的公众聚集场所 （  ）。", "options": {"A": "宾馆、饭店", "B": "商场、集贸市场", "C": "客运车站候车室、客运码头候船厅、民用机场航站楼", "D": "养老院，福利院，托儿所，幼儿园"}, "answer": ["D"], "source": {"sheet": "单选题（201题）", "row": 115}}, {"id": "single-114", "type": "single", "number": 114, "text": "火灾扑灭后，发生火灾的单位和相关人员不承担（  ）义务。", "options": {"A": "保护现场", "B": "接受事故调查", "C": "如实提供与火灾有关的情况", "D": "参加扑救的外单位专职消防队灭火剂补偿"}, "answer": ["D"], "source": {"sheet": "单选题（201题）", "row": 116}}, {"id": "single-115", "type": "single", "number": 115, "text": "乡镇人民政府、城市街道办事处应当指导、支持和帮助村民委员会、居民委员会开展群众性的消防工作。村民委员会、居民委员会应当确定（  ），组织制定防火安全公约，进行防火安全检查。", "options": {"A": "消防安全责任人", "B": "消防安全管理人", "C": "法定代表人", "D": "法定代理人"}, "answer": ["B"], "source": {"sheet": "单选题（201题）", "row": 117}}, {"id": "single-116", "type": "single", "number": 116, "text": "《湖北省消防条例》规定，每年（  ）为湖北省消防安全宣传月，（  ）为湖北省消防日。", "options": {"A": "1月    1月19日", "B": "5月    5月12日", "C": "9月   9月10日", "D": "11月   11月9日"}, "answer": ["D"], "source": {"sheet": "单选题（201题）", "row": 118}}, {"id": "single-117", "type": "single", "number": 117, "text": "《湖北省消防条例》规定，县级以上人民政府应当设立（  ），定期召开联席会议，研究、协调、解决消防工作中的重大问题。", "options": {"A": "安全生产委员会", "B": "消防安全委员会", "C": "防火安全领导小组", "D": "防火安全委员会"}, "answer": ["B"], "source": {"sheet": "单选题（201题）", "row": 119}}, {"id": "single-118", "type": "single", "number": 118, "text": "《湖北省消防条例》规定，政府（  ）对本行政区域内的消防工作负全面领导责任，（  ）对消防工作负直接领导责任。", "options": {"A": "分管负责人、主要负责人", "B": "主要负责人、其他负责人", "C": "分管负责人、其他负责人", "D": "主要负责人、分管负责人"}, "answer": ["D"], "source": {"sheet": "单选题（201题）", "row": 120}}, {"id": "single-119", "type": "single", "number": 119, "text": "《湖北省消防条例》规定，对不符合消防安全要求的老城区、城中村和传统商品集散地区，应当加快进行（  ）。", "options": {"A": "责令搬迁", "B": "限期拆除", "C": "消防改造", "D": "隐患整改"}, "answer": ["C"], "source": {"sheet": "单选题（201题）", "row": 121}}, {"id": "single-120", "type": "single", "number": 120, "text": "建设工程施工现场的消防安全管理由（  ）负责。", "options": {"A": "建设单位", "B": "施工单位", "C": "监理单位", "D": "消防部门"}, "answer": ["B"], "source": {"sheet": "单选题（201题）", "row": 122}}, {"id": "single-121", "type": "single", "number": 121, "text": "《湖北省消防条例》规定，住宅区的物业服务企业应当对服务区域内的（  ）消防设施进行维护管理，提供消防安全防范服务。", "options": {"A": "全部", "B": "共用", "C": "私人", "D": "其他"}, "answer": ["B"], "source": {"sheet": "单选题（201题）", "row": 123}}, {"id": "single-122", "type": "single", "number": 122, "text": "设置有火灾自动报警、自动灭火等自动消防系统的单位，应当委托具备相应资质的检测、维修机构对自动消防系统（  ）进行一次以上的检测和维修。", "options": {"A": "每季度", "B": "每半年", "C": "每年", "D": "每2年"}, "answer": ["C"], "source": {"sheet": "单选题（201题）", "row": 124}}, {"id": "single-123", "type": "single", "number": 123, "text": "《湖北省消防条例》规定，县级以上人民政府应当按照国家规定标准建立（  ），配备消防装备，承担火灾扑救工作。", "options": {"A": "保安消防队", "B": "志愿消防", "C": "国家综合性消防救援队、专职消防队", "D": "专职消防队、志愿消防队"}, "answer": ["C"], "source": {"sheet": "单选题（201题）", "row": 125}}, {"id": "single-124", "type": "single", "number": 124, "text": "《湖北省消防条例》规定，乡镇人民政府、街道办事处应当根据当地经济社会发展和消防工作需要，建立（  ），承担火灾扑救工作。", "options": {"A": "国家综合性消防救援队", "B": "保安消防队", "C": "国家综合性消防救援队、专职消防队", "D": "专职消防队、志愿消防队"}, "answer": ["D"], "source": {"sheet": "单选题（201题）", "row": 126}}, {"id": "single-125", "type": "single", "number": 125, "text": "《湖北省消防条例》规定，县级以上人民政府应当依托（  ）组建综合应急救援队伍，配备相应人员和装备，建立预警响应、指挥协调、信息通报、资源共享、培训演练、预案管理机制。", "options": {"A": "国家综合性消防救援队", "B": "专职消防队", "C": "国家综合性消防救援队、专职消防队", "D": "专职消防队、志愿消防队"}, "answer": ["A"], "source": {"sheet": "单选题（201题）", "row": 127}}, {"id": "single-126", "type": "single", "number": 126, "text": "《湖北省消防条例》规定，公安派出所按照国家、省有关规定开展日常消防监督检查，并将辖区内（  ）作为监督检查的重点。", "options": {"A": "公共娱乐场所", "B": "易燃易爆场所", "C": "个体工商业生产经营场所", "D": "消防安全重点单位"}, "answer": ["C"], "source": {"sheet": "单选题（201题）", "row": 128}}, {"id": "single-127", "type": "single", "number": 127, "text": "（  ）的门窗不得设置影响逃生和灭火救援的障碍物。", "options": {"A": "政府首脑机关", "B": "公共娱乐场所", "C": "易燃易爆场所", "D": "人员密集场所"}, "answer": ["D"], "source": {"sheet": "单选题（201题）", "row": 129}}, {"id": "single-128", "type": "single", "number": 128, "text": "依据《中华人民共和国消防法》，我国消防产品实行的市场准入制度是（    ）。", "options": {"A": "强制性产品认证和型式认可制度", "B": "型式认可制度和备案制度", "C": "强制性产品认证制度和技术鉴定制度", "D": "强制性产品认证制度和备案制度"}, "answer": ["C"], "source": {"sheet": "单选题（201题）", "row": 130}}, {"id": "single-129", "type": "single", "number": 129, "text": "高层民用建筑消防安全管理贯彻（  ）的方针，实行消防安全责任制。", "options": {"A": "隐患险于明火，防范胜于救灾", "B": "预防为主、防消结合", "C": "政府统一领导、部门依法监管、单位全面负责、公民积极参与", "D": "专门机关和群众相结合"}, "answer": ["B"], "source": {"sheet": "单选题（201题）", "row": 131}}, {"id": "single-130", "type": "single", "number": 130, "text": "高层民用建筑的（  ）是高层民用建筑消防安全责任主体，对高层民用建筑的消防安全负责。", "options": {"A": "业主、物业公司", "B": "业主、使用人", "C": "房东、业主", "D": "产权单位、物业公司"}, "answer": ["B"], "source": {"sheet": "单选题（201题）", "row": 132}}, {"id": "single-131", "type": "single", "number": 131, "text": "同一高层民用建筑有两个及以上业主、使用人的，各业主、使用人对其（  ）部分的消防安全负责，对（  ）部分的消防安全共同负责。", "options": {"A": "专有   共有", "B": "私有   共有", "C": "共有   私有", "D": "共有   专有"}, "answer": ["A"], "source": {"sheet": "单选题（201题）", "row": 133}}, {"id": "single-132", "type": "single", "number": 132, "text": "实行承包、租赁或者委托经营、管理时，业主应当提供符合（  ）要求的建筑物，督促使用人加强消防安全管理。", "options": {"A": "合同约定", "B": "消防安全", "C": "质量合格", "D": "建筑安全"}, "answer": ["B"], "source": {"sheet": "单选题（201题）", "row": 134}}, {"id": "single-133", "type": "single", "number": 133, "text": "高层民用建筑施工期间，建设单位应当与（  ）明确施工现场的消防安全责任。", "options": {"A": "产权单位", "B": "施工单位", "C": "使用单位", "D": "租赁单位"}, "answer": ["B"], "source": {"sheet": "单选题（201题）", "row": 135}}, {"id": "single-134", "type": "single", "number": 134, "text": "禁止在高层民用建筑内违反国家规定生产、储存、经营（  ）火灾危险性物品。", "options": {"A": "甲类", "B": "乙类", "C": "丙类", "D": "甲、乙类"}, "answer": ["D"], "source": {"sheet": "单选题（201题）", "row": 136}}, {"id": "single-135", "type": "single", "number": 135, "text": "禁止使用易燃、可燃材料作为高层民用建筑外墙（  ）材料。", "options": {"A": "内保温", "B": "外保温", "C": "装修、装饰", "D": "内、外保温"}, "answer": ["B"], "source": {"sheet": "单选题（201题）", "row": 137}}, {"id": "single-136", "type": "single", "number": 136, "text": "对于使用难燃外墙外保温材料或者采用与基层墙体、装饰层之间有空腔的建筑外墙外保温系统的高层民用建筑，禁止在其外墙（  ）。", "options": {"A": "燃放烟花爆竹", "B": "堆放可燃物", "C": "堆放杂物", "D": "动火用电"}, "answer": ["D"], "source": {"sheet": "单选题（201题）", "row": 138}}, {"id": "single-137", "type": "single", "number": 137, "text": "高层民用建筑的户外广告牌、外装饰不得采用（  ）材料，不得妨碍防烟排烟、逃生和灭火救援，不得改变或者破坏建筑立面防火结构。", "options": {"A": "易燃", "B": "可燃", "C": "易燃、可燃", "D": "难燃、不燃"}, "answer": ["C"], "source": {"sheet": "单选题（201题）", "row": 139}}, {"id": "single-138", "type": "single", "number": 138, "text": "建筑高度超过（  ）米的高层民用建筑外墙上设置的装饰、广告牌应当采用不燃材料并易于破拆。", "options": {"A": "50", "B": "54", "C": "80", "D": "100"}, "answer": ["A"], "source": {"sheet": "单选题（201题）", "row": 140}}, {"id": "single-139", "type": "single", "number": 139, "text": "高层公共建筑内餐饮场所的经营单位应当及时对厨房灶具和排油烟罩设施进行清洗，排油烟管道每（  ）至少进行一次检查、清洗。", "options": {"A": "周", "B": "月", "C": "季度", "D": "半年"}, "answer": ["C"], "source": {"sheet": "单选题（201题）", "row": 141}}, {"id": "single-140", "type": "single", "number": 140, "text": "高层民用建筑消防控制室应当由其管理单位实行（  ）值班制度，每班不应少于（  ）名值班人员。", "options": {"A": "24小时，1", "B": "12小时，1", "C": "24小时，2", "D": "8小时，2"}, "answer": ["C"], "source": {"sheet": "单选题（201题）", "row": 142}}, {"id": "single-141", "type": "single", "number": 141, "text": "因维修等需要停用建筑消防设施的，高层民用建筑的管理单位应当（  ），制定应急方案，落实防范措施，并在建筑入口处等显著位置公告。", "options": {"A": "严格履行内部审批手续", "B": "及时向管理人报告", "C": "向消防救援机构报告", "D": "通知全部业主、使用人"}, "answer": ["A"], "source": {"sheet": "单选题（201题）", "row": 143}}, {"id": "single-142", "type": "single", "number": 142, "text": "高层住宅建筑的消防设施日常运行、维护和维修、更新、改造费用，由（  ）依照法律规定承担；委托消防服务单位的，消防设施的日常运行、维护和检测费用应当纳入物业服务或者消防技术服务专项费用。", "options": {"A": "物业服务企业", "B": "产权单位", "C": "管理单位", "D": "业主"}, "answer": ["D"], "source": {"sheet": "单选题（201题）", "row": 144}}, {"id": "single-143", "type": "single", "number": 143, "text": "高层建筑内医院、养老院、寄宿制学校、幼儿园应当进行（  ）防火巡查，高层住宅建筑和高层公共建筑内的其他场所可以结合实际确定防火巡查的频次。", "options": {"A": "上午和下午", "B": "工作日和节假日", "C": "白天和夜间", "D": "不定期"}, "answer": ["C"], "source": {"sheet": "单选题（201题）", "row": 145}}, {"id": "single-144", "type": "single", "number": 144, "text": "高层住宅建筑应当每（  ）至少开展一次防火检查，高层公共建筑应当每（  ）至少开展一次防火检查，并填写检查记录。", "options": {"A": "月、周", "B": "半年、季度", "C": "月、半个月", "D": "季度、月"}, "answer": ["C"], "source": {"sheet": "单选题（201题）", "row": 146}}, {"id": "single-145", "type": "single", "number": 145, "text": "电动自行车存放、充电场所应当配备必要的消防器材，充电设施应当具备（  ）功能。", "options": {"A": "自动充电", "B": "电量显示", "C": "智能报警", "D": "充满自动断电"}, "answer": ["D"], "source": {"sheet": "单选题（201题）", "row": 147}}, {"id": "single-146", "type": "single", "number": 146, "text": "高层民用建筑的业主、使用人或者消防服务单位、统一管理人应当每（  ）至少组织开展一次整栋建筑的消防安全评估。", "options": {"A": "月", "B": "半年", "C": "季度", "D": "年"}, "answer": ["D"], "source": {"sheet": "单选题（201题）", "row": 148}}, {"id": "single-147", "type": "single", "number": 147, "text": "高层公共建筑内的单位应当每（  ）至少对员工开展一次消防安全教育培训。", "options": {"A": "月", "B": "半年", "C": "季度", "D": "年"}, "answer": ["B"], "source": {"sheet": "单选题（201题）", "row": 149}}, {"id": "single-148", "type": "single", "number": 148, "text": "高层住宅建筑的物业服务企业应当每（  ）至少对居住人员进行一次消防安全教育培训，进行一次疏散演练。", "options": {"A": "月", "B": "半年", "C": "季度", "D": "年"}, "answer": ["D"], "source": {"sheet": "单选题（201题）", "row": 150}}, {"id": "single-149", "type": "single", "number": 149, "text": "高层民用建筑应当在每（  ）的显著位置张贴安全疏散示意图，公共区域电子显示屏应当播放消防安全提示和消防安全知识。", "options": {"A": "栋", "B": "单元", "C": "区域", "D": "层"}, "answer": ["D"], "source": {"sheet": "单选题（201题）", "row": 151}}, {"id": "single-150", "type": "single", "number": 150, "text": "高层公共建筑应当在（  ）显著位置提示公众注意火灾危险，以及安全出口、疏散通道和灭火器材的位置。", "options": {"A": "首层", "B": "大厅", "C": "外墙", "D": "正门"}, "answer": ["A"], "source": {"sheet": "单选题（201题）", "row": 152}}, {"id": "single-151", "type": "single", "number": 151, "text": "高层住宅小区应当在显著位置设置消防安全宣传栏，在高层住宅建筑（  ）处提示安全用火、用电、用气，以及电动自行车存放、充电等消防安全常识。", "options": {"A": "单元入口", "B": "大厅", "C": "正门", "D": "外墙"}, "answer": ["A"], "source": {"sheet": "单选题（201题）", "row": 153}}, {"id": "single-152", "type": "single", "number": 152, "text": "高层民用建筑应当结合场所特点，（  ）编制灭火和应急疏散预案。", "options": {"A": "按功能分区", "B": "按岗位职责", "C": "按场所性质", "D": "分级分类"}, "answer": ["D"], "source": {"sheet": "单选题（201题）", "row": 154}}, {"id": "single-153", "type": "single", "number": 153, "text": "高层民用建筑应当每（  ）至少进行一次全要素综合演练，建筑高度超过100米的高层公共建筑应当每（  ）至少进行一次全要素综合演练。", "options": {"A": "半年、季度", "B": "月、半个月", "C": "季度、月", "D": "年、半年"}, "answer": ["D"], "source": {"sheet": "单选题（201题）", "row": 155}}, {"id": "single-154", "type": "single", "number": 154, "text": "高层民用建筑编制分预案的，有关单位和职能部门应当每（  ）至少进行一次综合演练或者专项灭火、疏散演练。", "options": {"A": "月", "B": "季度", "C": "半年", "D": "年"}, "answer": ["B"], "source": {"sheet": "单选题（201题）", "row": 156}}, {"id": "single-155", "type": "single", "number": 155, "text": "高层公共建筑，是指建筑高度（  ）公共建筑。", "options": {"A": "大于24米的", "B": "大于27米的", "C": "大于32米的", "D": "大于24米的非单层"}, "answer": ["D"], "source": {"sheet": "单选题（201题）", "row": 157}}, {"id": "single-156", "type": "single", "number": 156, "text": "高层住宅建筑，是指建筑高度（  ）的住宅建筑。", "options": {"A": "大于24米", "B": "大于27米", "C": "大于或等于24米", "D": "大于或等于27米"}, "answer": ["B"], "source": {"sheet": "单选题（201题）", "row": 158}}, {"id": "single-157", "type": "single", "number": 157, "text": "消防安全重点单位应当按照灭火和应急疏散预案，至少每（  ）进行一次演练。", "options": {"A": "月", "B": "季度", "C": "半年", "D": "年"}, "answer": ["C"], "source": {"sheet": "单选题（201题）", "row": 159}}, {"id": "single-158", "type": "single", "number": 158, "text": "机关、团体、事业单位应当至少每（  ）进行一次防火检查，其他单位应当至少每（  ）进行一次防火检查。", "options": {"A": "半年、季度", "B": "月、半个月", "C": "季度、月", "D": "年、半年"}, "answer": ["C"], "source": {"sheet": "单选题（201题）", "row": 160}}, {"id": "single-159", "type": "single", "number": 159, "text": "消防安全重点单位应履行《中华人民共和国消防法》（  ）规定的职责。", "options": {"A": "第十五条、第十六条", "B": "第十六条、第十七条", "C": "第十六条、第二十一条", "D": "第十六条、第十八条"}, "answer": ["B"], "source": {"sheet": "单选题（201题）", "row": 161}}, {"id": "single-160", "type": "single", "number": 160, "text": "《湖北省消防安全责任制规定》（鄂政发〔2020〕16号）规定市（州）县人民政府应当建立健全消防工作协调机制，成立由本级人民政府主要负责人或分管负责人、相关部门负责人参加的（  ），推动落实上级政府关于消防安全工作的部署。", "options": {"A": "消防安全委员会", "B": "安全生产委员会", "C": "防火工作委员会", "D": "消防救援委员会"}, "answer": ["A"], "source": {"sheet": "单选题（201题）", "row": 162}}, {"id": "single-161", "type": "single", "number": 161, "text": "根据中央关于深化消防执法改革的意见，市场监管总局会同应急管理部将强制性认证目录中的13类消防产品调整出目录，改为自愿性认证，目前仅保留（  ）种消防产品的强制性消防产品认证", "options": {"A": "一", "B": "三", "C": "五", "D": "七"}, "answer": ["B"], "source": {"sheet": "单选题（201题）", "row": 163}}, {"id": "single-162", "type": "single", "number": 162, "text": "《机关、团体、企业、事业单位消防安全管理规定》（公安部第61号令）规定，单位应当落实逐级消防安全责任制和岗位消防安全责任制，明确逐级和岗位消防安全职责，确定各级、各岗位的（  ）。", "options": {"A": "消防安全管理人", "B": "消防安全责任人"}, "answer": ["B"], "source": {"sheet": "单选题（201题）", "row": 164}}, {"id": "single-163", "type": "single", "number": 163, "text": "《机关、团体、企业、事业单位消防安全管理规定》（公安部第61号令）规定，拟订年度消防工作计划，组织实施日常消防安全管理工作是单位（  ）的职责。", "options": {"A": "消防安全管理人", "B": "消防安全责任人"}, "answer": ["A"], "source": {"sheet": "单选题（201题）", "row": 165}}, {"id": "single-164", "type": "single", "number": 164, "text": 规范性文件"}, "answer": ["A", "B", "C", "E"], "source": {"sheet": "多选题（217题）", "row": 103}}, {"id": "multiple-103", "type": "multiple", "number": 103, "text": "县级以上人民政府应当履行（  ）消防工作职责。", "options": {"A": "建立、落实消防工作责任制、问责制，将消防工作纳入政府年度工作考核体系和社会治安综合治理范围", "B": "建立完善消防通信指挥、战勤保障系统和灭火抢险救援区域协作机制，制定应急救援预案", "C": "加强公共消防设施和消防装备建设，根据需要增配复杂火灾扑救和特殊灾害事故抢险救援的装备", "D": "组织开展消防安全检查，督促整改重大火灾隐患", "E": "加强消防组织建设，建立综合性应急救援队伍，定期组织演练"}, "answer": ["A", "B", "C", "D", "E"], "source": {"sheet": "多选题（217题）", "row": 104}}, {"id": "multiple-104", "type": "multiple", "number": 104, "text": "乡镇人民政府、街道办事处应当建立（  ）。", "options": {"A": "健全消防工作制度", "B": "开展消防宣传教育", "C": "明确消防安全责任", "D": "落实消防安全措施", "E": "开展火灾隐患排查治理和灭火演练"}, "answer": ["A", "B", "C", "D", "E"], "source": {"sheet": "多选题（217题）", "row": 105}}, {"id": "multiple-105", "type": "multiple", "number": 105, "text": "对占用、堵塞、封闭疏散通道和安全出口、消防车通道、防火间距以及损坏消防设施器材不听劝阻、制止的，物业服务企业应当及时向（  ）报告。", "options": {"A": "当地政府", "B": "消防救援机构", "C": "公安派出所", "D": "业主委员会"}, "answer": ["B", "C"], "source": {"sheet": "多选题（217题）", "row": 106}}, {"id": "multiple-106", "type": "multiple", "number": 106, "text": "人员密集场所应当在醒目位置设置视频、警示牌或者采用广播等形式对公众提示（  ）。", "options": {"A": "场所存在的火灾危险性", "B": "场所的安全逃生路线、安全出口的具体位置以及遇到火灾等紧急情况时正确逃生、自救方法", "C": "场所内简易防护面罩、手电筒、灭火器等灭火、逃生设备器材的具体位置和使用方法", "D": "场所内的各种娱乐休闲设施"}, "answer": ["A", "B", "C"], "source": {"sheet": "多选题（217题）", "row": 107}}, {"id": "multiple-107", "type": "multiple", "number": 107, "text": "（  ）应当健全火灾风险防范机制，保证履行消防安全职责，保障公众安全，投保火灾公众责任保险。", "options": {"A": "公众聚集场所的经营者", "B": "个体工商业主", "C": "生产、储存、运输、销售易燃易爆危险品的企业", "D": "生产、储存、运输、销售不燃难燃物品的企业"}, "answer": ["A", "C"], "source": {"sheet": "多选题（217题）", "row": 108}}, {"id": "multiple-108", "type": "multiple", "number": 108, "text": "根据《高层民用建筑消防安全管理规定》规定，下列哪些属于高层公共建筑的业主单位、使用单位应当履行的消防安全职责（  ）。", "options": {"A": "遵守消防法律法规，建立和落实消防安全管理制度", "B": "拟订年度消防工作计划，组织实施日常消防安全管理工作", "C": "组织开展防火巡查、检查，及时消除火灾隐患", "D": "对建筑消防设施、器材定期进行检验、维修，确保完好有效", "E": "组织消防宣传教育培训，制定灭火和应急疏散预案，定期组织消防演练"}, "answer": ["A", "C", "D", "E"], "source": {"sheet": "多选题（217题）", "row": 109}}, {"id": "multiple-109", "type": "multiple", "number": 109, "text": "根据《高层民用建筑消防安全管理规定》规定，下列哪些属于高层住宅建筑的业主、使用人应当履行的消防安全义务（  ）。", "options": {"A": "遵守住宅小区防火安全公约和管理规约约定的消防安全事项", "B": "按照不动产权属证书载明的用途使用建筑", "C": "对占用、堵塞、封闭疏散通道、安全出口、消防车通道等违规行为予以制止", "D": "维护消防安全，保护消防设施，预防火灾，报告火警，成年人参加有组织的灭火工作"}, "answer": ["A", "B", "D"], "source": {"sheet": "多选题（217题）", "row": 110}}, {"id": "multiple-110", "type": "multiple", "number": 110, "text": "高层民用建筑每日防火巡查主要包括下列哪些内容（  ）。", "options": {"A": "用火、用电、用气有无违章情况", "B": "火灾隐患整改以及防范措施的落实", "C": "安全出口、疏散通道、消防车通道畅通情况", "D": "消防设施、器材完好情况，常闭式防火门关闭情况", "E": "消防安全重点部位人员在岗在位等情况"}, "answer": ["A", "C", "D", "E"], "source": {"sheet": "多选题（217题）", "row": 111}}, {"id": "multiple-111", "type": "multiple", "number": 111, "text": "宾馆、饭店火灾危险性主要有（  ）。", "options": {"A": "管理混乱", "B": "可燃物多，建筑火灾荷载较大", "C": "用火、用电、用气等致灾因素多", "D": "人员密集易造成群死群伤"}, "answer": ["B", "C", "D"], "source": {"sheet": "多选题（217题）", "row": 112}}, {"id": "multiple-112", "type": "multiple", "number": 112, "text": "商场的火灾危险性主要有（  ）。", "options": {"A": "营业厅面积大，划分防火分区难度增大", "B": "可燃商品多，火灾荷载大", "C": "人员高度密集，疏散难度大", "D": "用火用电设备多，致灾风险增大"}, "answer": ["A", "B", "C", "D"], "source": {"sheet": "多选题（217题）", "row": 113}}, {"id": "multiple-113", "type": "multiple", "number": 113, "text": "地下商场建筑中疏散通道的（  ）应采用A级装修材料。", "options": {"A": "顶棚", "B": "墙面", "C": "楼梯间", "D": "地面"}, "answer": ["A", "B", "C", "D"], "source": {"sheet": "多选题（217题）", "row": 114}}, {"id": "multiple-114", "type": "multiple", "number": 114, "text": "集贸市场的火灾危险性主要有（  ）。", "options": {"A": "自动消防设施少", "B": "建筑规模大易形成大面积火灾", "C": "人员密集通道拥挤", "D": "用火用电多，生活火源多"}, "answer": ["B", "C", "D"], "source": {"sheet": "多选题（217题）", "row": 115}}, {"id": "multiple-115", "type": "multiple", "number": 115, "text": "中小学校的火灾危险性主要有（  ）。", "options": {"A": "上课时人员密集，疏散时楼道拥挤，发生火灾可能引发伤亡", "B": "电、气焊作业多，可能引发火灾", "C": "实验室存放危险化学品", "D": "寄宿制学校的学生宿舍用火用电频繁"}, "answer": ["A", "C", "D"], "source": {"sheet": "多选题（217题）", "row": 116}}, {"id": "multiple-116", "type": "multiple", "number": 116, "text": "室外搭建的集贸市场，其顶棚应采用（  ）。", "options": {"A": "不燃材料", "B": "难燃材料", "C": "可燃材料", "D": "易燃材料", "E": "材料不限"}, "answer": ["A", "B"], "source": {"sheet": "多选题（217题）", "row": 117}}, {"id": "multiple-117", "type": "multiple", "number": 117, "text": "公共娱乐场所引发群死群伤的两个最主要的原因是（  ）。", "options": {"A": "安全疏散出口和窗户被铁栅栏、铁门、铝合金门等锁闭，致使发生火灾时逃生无门", "B": "顾客缺乏消防安全常识，不懂火灾扑救", "C": "自动灭火设施维护管理不当，火灾时发挥作用不充分", "D": "从业人员缺乏消防安全常识，致使初起火灾得不到有效的扑救，在场群众得不到及时疏散引导", "E": "营业员脱岗"}, "answer": ["A", "D"], "source": {"sheet": "多选题（217题）", "row": 118}}, {"id": "multiple-118", "type": "multiple", "number": 118, "text": "《公共娱乐场所消防安全管理规定》所指的公共娱乐场所包括（  ）。", "options": {"A": "影剧院、录像厅、礼堂等演出放映场所", "B": "舞厅、卡拉OK厅等歌舞娱乐场所", "C": "游艺、游乐场所", "D": "保龄球馆、旱冰场、桑拿浴室等营业性健身、休闲场所", "E": "具有娱乐功能的夜总会、音乐茶座和餐饮场所"}, "answer": ["A", "B", "C", "D", "E"], "source": {"sheet": "多选题（217题）", "row": 119}}, {"id": "multiple-119", "type": "multiple", "number": 119, "text": "公共娱乐场所不得设置在（  ）等建筑物内。", "options": {"A": "综合楼", "B": "博物馆", "C": "图书馆", "D": "文物古建筑", "E": "超过100米的高层建筑"}, "answer": ["B", "C", "D"], "source": {"sheet": "多选题（217题）", "row": 120}}, {"id": "multiple-120", "type": "multiple", "number": 120, "text": "公共娱乐场所严禁在营业时进行（  ）等施工、维修作业。", "options": {"A": "设备检修", "B": "电、气焊", "C": "油漆粉刷", "D": "音响调谐"}, "answer": ["A", "B", "C"], "source": {"sheet": "多选题（217题）", "row": 121}}, {"id": "multiple-121", "type": "multiple", "number": 121, "text": "公共娱乐场所全体员工必须熟知的消防安全知识包括（  ）。", "options": {"A": "会报火警", "B": "会使用灭火器材", "C": "会制定灭火预案", "D": "会组织人员疏散"}, "answer": ["A", "B", "D"], "source": {"sheet": "多选题（217题）", "row": 122}}, {"id": "multiple-122", "type": "multiple", "number": 122, "text": "公共娱乐场所按规定一般应设置的消防安全设施、设备包括（  ）。", "options": {"A": "灭火器", "B": "报警电话", "C": "火灾事故应急照明灯", "D": "灯光疏散指示标志"}, "answer": ["A", "B", "C", "D"], "source": {"sheet": "多选题（217题）", "row": 123}}, {"id": "multiple-123", "type": "multiple", "number": 123, "text": "公共娱乐场所禁止（ 217题）", "row": 204}}, {"id": "multiple-204", "type": "multiple", "number": 204, "text": "对在消防工作中有突出贡献的单位和个人，应当按照国家有关规定给予（  ）。", "options": {"A": "表彰", "B": "优待", "C": "鼓励", "D": "奖励"}, "answer": ["A", "D"], "source": {"sheet": "多选题（217题）", "row": 205}}, {"id": "multiple-205", "type": "multiple", "number": 205, "text": "地方各级人民政府在（  ），应当组织开展有针对性消防宣传教育，采取防火措施，进行消防安全检查。", "options": {"A": "森林和草原防火期间", "B": "农业收获季节", "C": "火灾多发季节", "D": "重大节日期间"}, "answer": ["A", "B", "C", "D"], "source": {"sheet": "多选题（217题）", "row": 206}}, {"id": "multiple-206", "type": "multiple", "number": 206, "text": "消防安全重点单位营业期间防火巡查内容是（  ）。", "options": {"A": "用火、用电有无违章情况", "B": "安全出口、疏散通道是否畅通，安全疏散指示标志、应急照明是否完好", "C": "消防设施、器材和消防安全标志是否在位、完整", "D": "常闭式防火门是否处于关闭状态，防火卷帘下是否堆放物品影响使用", "E": "消防安全重点部位的人员在岗情况", "F": "其他消防安全情况"}, "answer": ["A", "B", "C", "D", "E", "F"], "source": {"sheet": "多选题（217题）", "row": 207}}, {"id": "multiple-207", "type": "multiple", "number": 207, "text": "对下列违反消防安全规定的行为，应当责成有关人员当场改正的有（  ）。", "options": {"A": "疏散通道堵塞", "B": "常闭防火门处于开启状态", "C": "防火卷帘下堆放物品"}, "answer": ["A", "B", "C"], "source": {"sheet": "多选题（217题）", "row": 208}}, {"id": "multiple-208", "type": "multiple", "number": 208, "text": "灭火的基本方法（  ）。", "options": {"A": "冷却法", "B": "隔离法", "C": "窒息法", "D": "抑制法"}, "answer": ["A", "B", "C", "D"], "source": {"sheet": "多选题（217题）", "row": 209}}, {"id": "multiple-209", "type": "multiple", "number": 209, "text": "消防宣传“五进”是（  ）。", "options": {"A": "进社区、进企业", "B": "进学校、进家庭", "C": "进农村", "D": "进机关"}, "answer": ["A", "B", "C"], "source": {"sheet": "多选题（217题）", "row": 210}}, {"id": "multiple-210", "type": "multiple", "number": 210, "text": "（  ）的消防工作，由其主管单位的监督管理。", "options": {"A": "矿井地下部分", "B": "军事设施", "C": "核电厂", "D": "海上石油天然气设施"}, "answer": ["A", "B", "C", "D"], "source": {"sheet": "多选题（217题）", "row": 211}}, {"id": "multiple-211", "type": "multiple", "number": 211, "text": "负责公共消防设施维护管理的单位，应当保持（  ）等公共消防设施的完好有效。", "options": {"A": "消防车通道", "B": "消防供水", "C": "疏散通道", "D": "消防通信"}, "answer": ["A", "B", "D"], "source": {"sheet": "多选题（217题）", "row": 212}}, {"id": "multiple-212", "type": "multiple", "number": 212, "text": "（  ）根据需要，建立志愿消防队等多种形式的消防组织，开展群众性自防自救工作。", "options": {"A": "村民委员会", "B": "机关、团体、企业、事业等单位", "C": "居民委员会", "D": "城市街道办事处"}, "answer": ["A", "B", "C"], "source": {"sheet": "多选题（217题）", "row": 213}}, {"id": "multiple-213", "type": "multiple", "number": 213, "text": "村民委员会、居民委员会应当（  ）。", "options": {"A": "确定消防安全责任人", "B": "确定消防安全管理人", "C": "组织制定防火安全公约", "D": "进行防火安全检查"}, "answer": ["B", "C", "D"], "source": {"sheet": "多选题（217题）", "row": 214}}, {"id": "multiple-214", "type": "multiple", "number": 214, "text": "各级人民政府应当（  ）。", "options": {"A": "将消防工作纳入国民经济和社会发展计划", "B": "组织开展经常性的消防宣传教育", "C": "指导、支持和帮助村（居）民委员会开展群众性的消防工作", "D": "保障消防工作与经济社会发展相适应"}, "answer": ["A", "B", "D"], "source": {"sheet": "多选题（217题）", "row": 215}}, {"id": "multiple-215", "type": "multiple", "number": 215, "text": "消防救援机构及其工作人员执行职务，应当自觉接受（  ）的监督。", "options": {"A": "政府部门", "B": "社会", "C": "司法机关", "D": "公民"}, "answer": ["B", "D"], "source": {"sheet": "多选题（217题）", "row": 216}}, {"id": "multiple-216", "type": "multiple", "number": 216, "text": "消防救援机构及其工作人员应当认真履行职责，做到（  ）。", "options": {"A": "公正", "B": "公开", "C": "文明", "D": "高效", "E": "严格"}, "answer": ["A", "C", "D", "E"], "source": {"sheet": "多选题（217题）", "row": 217}}, {"id": "multiple-217", "type": "multiple", "number": 217, "text": "发生火灾时有关单位有（  ）责任。", "options": {"A": "发生火灾的单位必须立即组织力量扑救火灾", "B": "临近单位应当给予支援", "C": "临近单位应给予发生火灾单位经济援助", "D": "发生火灾的单位必须给志愿参加灭火工作的人员经济报酬"}, "answer": ["A", "B"], "source": {"sheet": "多选题（217题）", "row": 218}}, {"id": "judge-001", "type": "judge", "number": 1, "text": "具备了燃烧的必要条件，燃烧一定能够发生。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 2}}, {"id": "judge-002", "type": "judge", "number": 2, "text": "可燃气体或蒸气只有达到一定浓度时，才会发生燃烧或爆炸。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 3}}, {"id": "judge-003", "type": "judge", "number": 3, "text": "对于一般可燃固体，将其冷却到其燃点以下，燃烧反应就会中止。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 4}}, {"id": "judge-004", "type": "judge", "number": 4, "text": "对于可燃液体，将其冷却到其燃点以下，燃烧反应就会中止。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 5}}, {"id": "judge-005", "type": "judge", "number": 5, "text": "在规定的试验条件下，液体或固体能发生持续燃烧的最低温度称为燃点。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 6}}, {"id": "judge-006", "type": "judge", "number": 6, "text": "液体火灾危险性分类及分级是根据其燃点来划分的。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 7}}, {"id": "judge-007", "type": "judge", "number": 7, "text": "在火灾中燃烧放出的烟，大多是完全燃烧所生成的。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 8}}, {"id": "judge-008", "type": "judge", "number": 8, "text": "热辐射不需要通过任何介质传播。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 9}}, {"id": "judge-009", "type": "judge", "number": 9, "text": "二氧化碳灭火剂灭火机理主要是物理作用和化学作用。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 10}}, {"id": "judge-010", "type": "judge", "number": 10, "text": "一般可燃液体的闪点都低于其燃点。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 11}}, {"id": "judge-011", "type": "judge", "number": 11, "text": "物质的燃烧需要氧化剂，氧化剂就是含氧的化合物。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 12}}, {"id": "judge-012", "type": "judge", "number": 12, "text": "可燃液体或固体燃烧时，从火焰结构来看，内焰比焰心和外焰的亮度强，所以，内焰的温度最高。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 13}}, {"id": "judge-013", "type": "judge", "number": 13, "text": "可燃固体表面积越大，与空气中的氧接触的机会越多，氧化的速率越快，燃烧也就越容易。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 14}}, {"id": "judge-014", "type": "judge", "number": 14, "text": "不同的材料有不同的氧指数，材料的氧指数表示材料燃烧的难易程度。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 15}}, {"id": "judge-015", "type": "judge", "number": 15, "text": "爆炸物质在爆炸过程中都是由化学爆炸引起的。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 16}}, {"id": "judge-016", "type": "judge", "number": 16, "text": "不燃烧体指用不燃材料做成的建筑构件或用可燃材料做成而用不燃材料做保护层的建筑构件。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 17}}, {"id": "judge-017", "type": "judge", "number": 17, "text": "难燃烧体指用难燃材料做成的建筑构件或用可燃材料做成而用不燃材料做保护层的建筑构件。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 18}}, {"id": "judge-018", "type": "judge", "number": 18, "text": "除了含有碳和氢的化合物以外，其他物质均不是可燃的。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 19}}, {"id": "judge-019", "type": "judge", "number": 19, "text": "各种物质发生燃烧，均需有本身固定的含氧量要求。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 20}}, {"id": "judge-020", "type": "judge", "number": 20, "text": "所谓防火和灭火的基本措施就是去掉一个或几个燃烧所需的必要和充分条件。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 21}}, {"id": "judge-021", "type": "judge", "number": 21, "text": "灭火的基本原理只有冷却、窒息和化学抑制。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 22}}, {"id": "judge-022", "type": "judge", "number": 22, "text": "冷却、窒息灭火作用主要是物理过程，化学抑制是一个化学过程。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 23}}, {"id": "judge-023", "type": "judge", "number": 23, "text": "如果把可燃物与引火源及氧隔离开来，燃烧反应就会自动中止。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 24}}, {"id": "judge-024", "type": "judge", "number": 24, "text": "物质的有焰燃烧中的氧化反应，都是通过链式反应进行的。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 25}}, {"id": "judge-025", "type": "judge", "number": 25, "text": "在液体（固体）表面产生足够的可燃蒸气，遇火能产生一闪即灭的火焰燃烧现象称闪燃。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 26}}, {"id": "judge-026", "type": "judge", "number": 26, "text": "以超音速传播的爆炸称为爆燃。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 27}}, {"id": "judge-027", "type": "judge", "number": 27, "text": "可燃物在没有外部明火焰等火源的作用下，因受热或自身发热并蓄热所产生的燃烧现象称为阴燃。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 28}}, {"id": "judge-028", "type": "judge", "number": 28, "text": "液体同系物的闪点随其分子量的增加而升高，随其沸点升高而升高。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 29}}, {"id": "judge-029", "type": "judge", "number": 29, "text": "低闪点液体和高闪点液体形成的混合液，其闪点低于这两种液体闪点的平均值。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 30}}, {"id": "judge-030", "type": "judge", "number": 30, "text": "各组分混合液，如汽油、煤油等，其闪点随沸程的增加而升高。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 31}}, {"id": "judge-031", "type": "judge", "number": 31, "text": "在规定条件下，固体材料在氧、氮混合气流中，维持平稳燃烧所需的最低氧含量称为氧指数。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 32}}, {"id": "judge-032", "type": "judge", "number": 32, "text": "可燃液体的燃烧实际上是可燃液体蒸气的燃烧。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 33}}, {"id": "judge-033", "type": "judge", "number": 33, "text": "液体在燃烧过程中产生沸溢和喷溅的现象称为突沸。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 34}}, {"id": "judge-034", "type": "judge", "number": 34, "text": "熔点较低的可燃固体，受热后熔融，然后与可燃液体一样蒸发成蒸气而燃烧的方式称为表面燃烧。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 35}}, {"id": "judge-035", "type": "judge", "number": 35, "text": "分子结构复杂的固体可燃物，在受热后分解出其组成成分与加热温度相应的热分解产物，这些分解产物再氧化燃烧，称为分解燃烧。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 36}}, {"id": "judge-036", "type": "judge", "number": 36, "text": "热传导是影响火灾发展的决定性因素。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 37}}, {"id": "judge-037", "type": "judge", "number": 37, "text": "导热系数愈大、厚度愈小、传导的热量愈多。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 38}}, {"id": "judge-038", "type": "judge", "number": 38, "text": "热通过流动介质，由空间的一处传播到另一处的现象，叫热传导。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 39}}, {"id": "judge-039", "type": "judge", "number": 39, "text": "燃烧区的温度愈高，与环境温度的温差愈大，热对流速度愈快。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 40}}, {"id": "judge-040", "type": "judge", "number": 40, "text": "任何物体都能把热以电磁波的形式辐射出去，也能吸收别的物体辐射出来的热能。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 41}}, {"id": "judge-041", "type": "judge", "number": 41, "text": "热辐射必须通过气体、液体、固体等介质，才能进行辐射。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 42}}, {"id": "judge-042", "type": "judge", "number": 42, "text": "由于物质急剧氧化或分解反应，使温度、压力增加或使两者同时增加的现象，称为爆燃。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 43}}, {"id": "judge-043", "type": "judge", "number": 43, "text": "由于液体变成蒸气或者气体迅速膨胀，压力急速增加，并超过容器的极限压力而发生的爆炸称物理爆炸。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 44}}, {"id": "judge-044", "type": "judge", "number": 44, "text": "遇火产生爆炸的最高或最低浓度，称为爆炸极限，通常用体积百分比表示。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 45}}, {"id": "judge-045", "type": "judge", "number": 45, "text": "易燃、可燃性气体、蒸气或粉尘与空气组成的混合物，能使火焰传播的最低浓度，称为该气体或蒸气的爆炸下限，也称燃烧下限。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 46}}, {"id": "judge-046", "type": "judge", "number": 46, "text": "可燃性气体、蒸气或粉尘与空气组成的混合物，能使火焰传播的最高浓度，称为该气体或蒸气的爆炸上限，也称燃烧上限。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 47}}, {"id": "judge-047", "type": "judge", "number": 47, "text": "初始温度越高，爆炸范围越大。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 48}}, {"id": "judge-048", "type": "judge", "number": 48, "text": "初始压力升高，爆炸极限范围变小。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 49}}, {"id": "judge-049", "type": "judge", "number": 49, "text": "混合可燃气体中加入惰性气体，使爆炸极限范围缩小，对爆炸上限的影响更大。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 50}}, {"id": "judge-050", "type": "judge", "number": 50, "text": "混合物含氧量增加，爆炸下限降低，爆炸上限上升。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 51}}, {"id": "judge-051", "type": "judge", "number": 51, "text": "充装爆炸性混合气体的容器管径越小，爆炸极限范围越小。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 52}}, {"id": "judge-052", "type": "judge", "number": 52, "text": "颗粒越粗大比表面积越大，氧吸附越多，爆炸危险性越大。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 53}}, {"id": "judge-053", "type": "judge", "number": 53, "text": "任何粉尘与空气的混合物达到一定的浓度范围都会发生爆炸。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 54}}, {"id": "judge-054", "type": "judge", "number": 54, "text": "空气的含水量越高、可燃粉尘含量越少、引爆能量越高。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 55}}, {"id": "judge-055", "type": "judge", "number": 55, "text": "可燃粉尘随着含氧量的增加，爆炸浓度范围扩大。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 56}}, {"id": "judge-056", "type": "judge", "number": 56, "text": "由燃烧或热解作用而产生的全部的物质，称为燃烧产物。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 57}}, {"id": "judge-057", "type": "judge", "number": 57, "text": "一般单质在空气中都是不完全燃烧，如：碳、氢、硫等。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 58}}, {"id": "judge-058", "type": "judge", "number": 58, "text": "化合物燃烧产物中，一氧化碳是最典型的未完全燃烧产物。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 59}}, {"id": "judge-059", "type": "judge", "number": 59, "text": "合成高分子材料燃烧产物，会产生许多有毒或有刺激性气体。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 60}}, {"id": "judge-060", "type": "judge", "number": 60, "text": "CO2是火灾中致人中毒死亡的主要燃烧产物之一。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 61}}, {"id": "judge-061", "type": "judge", "number": 61, "text": "水在常温下具有较高的粘度、较高的热稳定性、较大的密度和较高的表面张力，是一种天然灭火剂。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 62}}, {"id": "judge-062", "type": "judge", "number": 62, "text": "沥青火灾属于固体物质火灾。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 63}}, {"id": "judge-063", "type": "judge", "number": 63, "text": "火灾是在时间或空间上失去控制的燃烧所造成的灾害。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 64}}, {"id": "judge-064", "type": "judge", "number": 64, "text": "在液体表面上能产生足够的可燃蒸气，遇火能产生一闪即灭的燃烧现象称为闪燃。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 65}}, {"id": "judge-065", "type": "judge", "number": 65, "text": "可燃物质在没有外部火花、火焰等火源的作用下，因受热或自身发热并蓄热，所产生的燃烧称为自燃。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 66}}, {"id": "judge-066", "type": "judge", "number": 66, "text": "在规定的试验条件下，液体表面能产生闪燃的液体最低温度称为闪点。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 67}}, {"id": "judge-067", "type": "judge", "number": 67, "text": "由于物质急剧氧化或分解反应，使温度、压力增加或使两者同时增加的现象，称为爆炸。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 68}}, {"id": "judge-068", "type": "judge", "number": 68, "text": "粉尘爆炸属于化学爆炸。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 69}}, {"id": "judge-069", "type": "judge", "number": 69, "text": "爆炸极限是指易燃、可燃的气体、蒸气或粉尘与空气混合后，遇火会产生爆炸的最高或最低的浓度。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 70}}, {"id": "judge-070", "type": "judge", "number": 70, "text": "粉尘的浓度越大就越容易发生粉尘爆炸。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 71}}, {"id": "judge-071", "type": "judge", "number": 71, "text": "可燃气体爆炸下限越低则火灾危险性越大。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 72}}, {"id": "judge-072", "type": "judge", "number": 72, "text": "闪点是衡量液体火灾危险性的重要参数。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 73}}, {"id": "judge-073", "type": "judge", "number": 73, "text": "只有液态可燃物才会产生闪燃现象。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 74}}, {"id": "judge-074", "type": "judge", "number": 74, "text": "材料的氧指数表示材料燃烧的难易程度，氧指数高表示材料容易燃烧，氧指数低表示材料不易燃烧。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 75}}, {"id": "judge-075", "type": "judge", "number": 75, "text": "燃烧产物是指燃烧后剩余的物质。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 76}}, {"id": "judge-076", "type": "judge", "number": 76, "text": "储有氯气的钢瓶与储有氢气的钢瓶可同车运输。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 77}}, {"id": "judge-077", "type": "judge", "number": 77, "text": "棉、麻、煤、草、湿木材等固体可燃物在空气不流通或含水分较重时会阴燃。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 78}}, {"id": "judge-078", "type": "judge", "number": 78, "text": "可燃气体、蒸气或粉尘与空气组成的混合物，其爆炸下限随初始温度和初始压力的升高而升高。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 79}}, {"id": "judge-079", "type": "judge", "number": 79, "text": "活性炭自燃的主要原因是吸附生热。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 80}}, {"id": "judge-080", "type": "judge", "number": 80, "text": "锯末自燃的主要原因是吸附生热。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 81}}, {"id": "judge-081", "type": "judge", "number": 81, "text": "易燃可燃液体的燃烧速度与液体的蒸发速度无关。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 82}}, {"id": "judge-082", "type": "judge", "number": 82, "text": "阴燃和有焰燃烧在一定条件下能相互转化。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 83}}, {"id": "judge-083", "type": "judge", "number": 83, "text": "活性催化剂能降低自燃点，钝性催化剂能提高自燃点。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 84}}, {"id": "judge-084", "type": "judge", "number": 84, "text": "合成纤维是以煤、石油、天然气、石灰石、某些农副产品等天然资源为原料，经过化学合成与机械加工而制成得的纤维。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 85}}, {"id": "judge-085", "type": "judge", "number": 85, "text": "氯酸钾与浓硫酸可以同车运输。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 86}}, {"id": "judge-086", "type": "judge", "number": 86, "text": "一切物质的燃烧都是分为两个阶段进行的。先是氧化剂和可燃物质的分子互相接触而开始的缓慢氧化反应，温度不断地升高而达到自燃；然后便是连续的燃烧阶段。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 87}}, {"id": "judge-087", "type": "judge", "number": 87, "text": "一般情况下，含氧量高的有机化合物燃烧时，其火焰不显光或发出蓝色的光，很少有烟熏现象。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 88}}, {"id": "judge-088", "type": "judge", "number": 88, "text": "一级自燃物品是指化学性质比较活泼，在空气中易氧化或分解，从而产生热量达到自燃的物品。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 89}}, {"id": "judge-089", "type": "judge", "number": 89, "text": "一般的规律是，可燃气体和蒸气在氧气中的爆炸浓度极限范围比在空气中的大，因此，可燃气体和蒸气在氧气中的危险性更大。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 90}}, {"id": "judge-090", "type": "judge", "number": 90, "text": "按照最小点火能量的高低，将能够燃烧的液体分为易燃液体和可燃液体。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 91}}, {"id": "judge-091", "type": "judge", "number": 91, "text": "静电火花能否成为火源，一是要看被可能引燃的对象的最小点火能量；二是要看静电的放电能量。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 92}}, {"id": "judge-092", "type": "judge", "number": 92, "text": "易燃易爆气体的爆炸浓度下限一般都在10％以上。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 93}}, {"id": "judge-093", "type": "judge", "number": 93, "text": "液化石油气比甲烷、乙烷更容易扩散。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 94}}, {"id": "judge-094", "type": "judge", "number": 94, "text": "易燃固体系指燃点低，对热、撞击、摩擦敏感，易被外部火源点燃，燃烧迅速，并可能散发出有毒烟雾或有毒气体的固体，但不包括已列入爆炸品的物质。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 95}}, {"id": "judge-095", "type": "judge", "number": 95, "text": "自燃物品系指自燃点低，在空气中易发生氧化反应，放出热量而自行燃烧的物品。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 96}}, {"id": "judge-096", "type": "judge", "number": 96, "text": "遇湿易燃物品系指遇水或受潮时，发生剧烈化学反应，放出大量的易燃气体和热量的物品，有的不需明火，即能燃烧或爆炸。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 97}}, {"id": "judge-097", "type": "judge", "number": 97, "text": "氧化剂系指处于高氧化态，具有强氧化性，易分解并放出氧和热量的物质。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 98}}, {"id": "judge-098", "type": "judge", "number": 98, "text": "有机过氧化物系指分子组成中含有过氧基的有机物，其本身易燃易爆，极易分解，对热、震动或摩擦极为敏感的物质。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 99}}, {"id": "judge-099", "type": "judge", "number": 99, "text": "毒害品系指进入肌体后累积达一定的量，能与体液和器官组织发生生物化学作用或生物物理学作用，扰乱或破坏肌体的正常生理功能，引起某些器官和系统暂时性或持久性的病变，甚至危及生命的物品。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 100}}, {"id": "judge-100", "type": "judge", "number": 100, "text": "氯酸盐、硝酸盐均可与烃类、醇类、油脂等物质混合接触。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 101}}, {"id": "judge-101", "type": "judge", "number": 101, "text": "生产易燃易爆危险物品的单位，对产品应当附有燃点、闪点、爆炸极限等数据的说明书，并且注明防火防爆的注意事项。对独立包装的易燃易爆危险物品应当贴附危险品标签。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 102}}, {"id": "judge-102", "type": "judge", "number": 102, "text": "进入生产、储存易燃易爆危险物品的场所，必须执行国家有关消防安全的规定。禁止携带火种进入生产、储存易燃易爆危险物品的场所。禁止非法携带易燃易爆危险物品进入公共场所或者乘坐公共交通工具。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 103}}, {"id": "judge-103", "type": "judge", "number": 103, "text": "间歇性精神病人在精神正常时有违法行为的，不应给予行政处罚。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 104}}, {"id": "judge-104", "type": "judge", "number": 104, "text": "已满十四周岁不满十八周岁的未成年人有违法行为的，可以免于行政处罚。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 105}}, {"id": "judge-105", "type": "judge", "number": 105, "text": "国务院的部门规章有权设定一定范围内的行政许可事项。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 106}}, {"id": "judge-106", "type": "judge", "number": 106, "text": "高层公共建筑的消防安全管理人应当具备与其职责相适应的消防安全知识和管理能力。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 107}}, {"id": "judge-107", "type": "judge", "number": 107, "text": "向社会公开法律文书，应当对文书中载明的自然人姓名作隐名处理，保留姓氏，名字以“某”替代。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 108}}, {"id": "judge-108", "type": "judge", "number": 108, "text": "建筑高度超过32米的高层民用建筑外墙上设置的装饰、广告牌必须采用不燃材料并易于破拆。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 109}}, {"id": "judge-109", "type": "judge", "number": 109, "text": "禁止在高层民用建筑公共门厅、疏散走道、楼梯间、安全出口停放电动自行车或者为电动自行车充电。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 110}}, {"id": "judge-110", "type": "judge", "number": 110, "text": "高层公共建筑应当在首层显著位置提示公众注意火灾危险，以及安全出口、疏散通道和灭火器材的位置。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 111}}, {"id": "judge-111", "type": "judge", "number": 111, "text": "高层民用建筑应当每年至少进行一次全要素综合演练，建筑高度超过50米的高层公共建筑应当每半年至少进行一次全要素综合演练。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 112}}, {"id": "judge-112", "type": "judge", "number": 112, "text": "新修订的《国家赔偿法》不承认精神损害赔偿。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 113}}, {"id": "judge-113", "type": "judge", "number": 113, "text": "单位可以根据需要确定本单位的消防安全责任人，消防安全责任人对单位的消防安全管理负责，实施和组织落实规定的消防安全管理工作。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 114}}, {"id": "judge-114", "type": "judge", "number": 114, "text": "单位应当落实逐级消防安全责任制和岗位消防安全责任制，明确逐级和岗位消防安全职责，确定各级、各岗位的消防安全责任人。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 115}}, {"id": "judge-115", "type": "judge", "number": 115, "text": "对建筑物实行承包、租赁或者委托经营、管理时，消防车通道、涉及公共消防安全的疏散设施和其他建筑消防设施应当由产权单位或者委托管理的单位统一管理。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 116}}, {"id": "judge-116", "type": "judge", "number": 116, "text": "对于有两个以上产权单位和使用单位的建筑物，各产权单位、使用单位对消防车通道、涉及公共消防安全的疏散设施和其他建筑消防设施应当明确管理责任，可以委托统一管理。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 117}}, {"id": "judge-117", "type": "judge", "number": 117, "text": "消防安全重点单位应当设置或者确定消防工作的归口管理职能部门，并确定专职或者兼职的消防管理人员，单位的消防安全责任人或者消防安全管理人在归口职能部门的领导下开展消防安全管理工作。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 118}}, {"id": "judge-118", "type": "judge", "number": 118, "text": "机关、团体、事业单位应当至少每月进行一次防火检查，其他单位应当至少每季度进行一次防火检查。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 119}}, {"id": "judge-119", "type": "judge", "number": 119, "text": "消防安全重点单位应当建立健全消防档案。消防档案应当包括消防安全基本情况和消防安全管理情况。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 120}}, {"id": "judge-120", "type": "judge", "number": 120, "text": "设有自动消防设施的单位，应当按照有关规定定期对其自动消防设施进行全面检查测试，并出具检测报告，存档备查。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 121}}, {"id": "judge-121", "type": "judge", "number": 121, "text": "公共娱乐场所在营业期间禁止动火施工，因特殊情况需要动火的，动火部门和人员落实保障措施、落实现场监护人后可以动火施工。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 122}}, {"id": "judge-122", "type": "judge", "number": 122, "text": "公众聚集场所或者两个以上单位共同使用的建筑物局部施工需要使用明火时，施工单位和使用单位应当共同采取措施，将施工区和使用区进行防火分隔，消除动火区的易燃、可燃物，配置消防器材，专人监护，保证施工及使用范围的消防安全。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 123}}, {"id": "judge-123", "type": "judge", "number": 123, "text": "机关、团体、企业、事业单位及其消防安全责任人、消防安全管理人应当报当地消防救援机构备案。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 124}}, {"id": "judge-124", "type": "judge", "number": 124, "text": "火灾隐患指因违反消防法规，可能导致火灾发生或使火灾危害增大的各类潜在不安全因素，包括人的不安全行为、管理上的缺陷和物的不安全状态。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 125}}, {"id": "judge-125", "type": "judge", "number": 125, "text": "法律规定由行政机关最终裁决的行政行为，人民法院对就行政机关依法作出的最终裁决提起的行政诉讼不予受理。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 126}}, {"id": "judge-126", "type": "judge", "number": 126, "text": "行政复议是行政诉讼的必经程序。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 127}}, {"id": "judge-127", "type": "judge", "number": 127, "text": "行政诉讼的法律特征之一是提起的行政诉讼属于人民法院的受案范围和受诉人民法院管辖。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 128}}, {"id": "judge-128", "type": "judge", "number": 128, "text": "违法行使行政职权侵害了公民、法人或者其他组织的合法权益，应当承担行政赔偿责任。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 129}}, {"id": "judge-129", "type": "judge", "number": 129, "text": "行政赔偿由国家予以赔偿。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 130}}, {"id": "judge-130", "type": "judge", "number": 130, "text": "受害人可直接向行政机关提出赔偿。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 131}}, {"id": "judge-131", "type": "judge", "number": 131, "text": "受害人可在申请复议时连带请求赔偿。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 132}}, {"id": "judge-132", "type": "judge", "number": 132, "text": "受害人可直接向人民法院提起行政诉讼时连带提出赔偿请求。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 133}}, {"id": "judge-133", "type": "judge", "number": 133, "text": "消防行政复议是行政管理相对人的一种救济手段。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 134}}, {"id": "judge-134", "type": "judge", "number": 134, "text": "生产、储存、经营易燃易爆危险品的场所可以与居住场所设置在同一建筑物内。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 135}}, {"id": "judge-135", "type": "judge", "number": 135, "text": "机关、团体、企业、事业等单位对建筑消防设施每年至少进行一次全面检测，确保完好有效，检测记录应当完整准确，存档备查。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 136}}, {"id": "judge-136", "type": "judge", "number": 136, "text": "《中华人民共和国消防法》中，公众聚集场所包括人员密集场所。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 137}}, {"id": "judge-137", "type": "judge", "number": 137, "text": "住宅区的物业服务企业应当对管理区域内的共用消防设施进行维护管理，提供消防安全防范服务。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 138}}, {"id": "judge-138", "type": "judge", "number": 138, "text": "村民委员会、居民委员会应当确定消防安全管理人，组织制定防火安全公约，进行防火安全检查。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 139}}, {"id": "judge-139", "type": "judge", "number": 139, "text": "对因参加扑救火灾或者应急救援受伤、致残或者死亡的人员，按照国家有关规定给予医疗、抚恤。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 140}}, {"id": "judge-140", "type": "judge", "number": 140, "text": "消防救援机构应当对机关、团体、企业、事业等单位遵守消防法律、法规的情况依法进行监督检查。公安派出所不需要负责日常消防监督检查、开展消防宣传教育，具体办法由国务院公安部门规定。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 141}}, {"id": "judge-141", "type": "judge", "number": 141, "text": "任何单位和个人都有权对消防救援机构及其工作人员在执法中的违法行为进行检举、控告。收到检举、控告的机关，应当按照职责及时查处。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 142}}, {"id": "judge-142", "type": "judge", "number": 142, "text": "任何人发现火灾都应当立即报警。任何单位、个人都应当为报警提供便利，不得阻拦报警，有关费用由消防救援机构承担。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 143}}, {"id": "judge-143", "type": "judge", "number": 143, "text": "单位专职消防队、志愿消防队参加扑救外单位火灾所损耗的燃料、灭火剂和器材、装备等，由发生火灾的单位给予补偿。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 144}}, {"id": "judge-144", "type": "judge", "number": 144, "text": "在具有火灾、爆炸危险的场所使用明火，作业人员只需要采取相应的消防安全措施。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 145}}, {"id": "judge-145", "type": "judge", "number": 145, "text": "人员密集场所室内装修、装饰，按照消防技术标准的要求，可以使用不燃、难燃、可燃材料。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 146}}, {"id": "judge-146", "type": "judge", "number": 146, "text": "消防监督检查是行政机关的行政执法行为。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 147}}, {"id": "judge-147", "type": "judge", "number": 147, "text": "消防救援机构应当对公安派出所消防监督检查工作进行业务指导。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 148}}, {"id": "judge-148", "type": "judge", "number": 148, "text": "音乐茶座和餐饮场所、保龄球馆、旱冰场不是公共娱乐场所。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 149}}, {"id": "judge-149", "type": "judge", "number": 149, "text": "建筑工程施工现场的消防安全应由监理单位负责。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 150}}, {"id": "judge-150", "type": "judge", "number": 150, "text": "居民住宅区的物业管理单位不对管理范围内的消防安全工作负责。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 151}}, {"id": "judge-151", "type": "judge", "number": 151, "text": "消防安全重点单位应当按照灭火和应急疏散预案，至少每年进行一次演练，并结合实际，不断完善预案。其他单位应当结合本单位实际，参照制定相应的应急方案，至少每两年组织一次演练。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 152}}, {"id": "judge-152", "type": "judge", "number": 152, "text": "报刊、广播、电影、电视、互联网站等公众媒体可以有偿开展消防宣传教育。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 153}}, {"id": "judge-153", "type": "judge", "number": 153, "text": "家庭应当做好经常性的用火、用电、用油、用气安全自查。鼓励家庭自备简易灭火器材和自救逃生器具。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 154}}, {"id": "judge-154", "type": "judge", "number": 154, "text": "禁止生产、销售或者使用不合格的消防产品以及国家明令淘汰的消防产品。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 155}}, {"id": "judge-155", "type": "judge", "number": 155, "text": "禁止非法携带易燃易爆危险品乘坐公共交通工具。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 156}}, {"id": "judge-156", "type": "judge", "number": 156, "text": "省人民政府对乡镇多种形式的消防组织建设给予适当补贴。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 157}}, {"id": "judge-157", "type": "judge", "number": 157, "text": "环保、气象、地震、测绘、通信、供水、供电、供油、供气等有关部门和单位，应当及时、无偿向消防救援机构提供可能影响消防安全、灭火和抢险救援工作的信息资料。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 158}}, {"id": "judge-158", "type": "judge", "number": 158, "text": "国家综合性消防救援队在执行扑救火灾任务时，可以对因占用消防车通道而影响消防车辆通行的障碍物实施强制让道或者拆除。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 159}}, {"id": "judge-159", "type": "judge", "number": 159, "text": "国家综合性消防救援队、专职消防队扑救火灾、实施应急救援，可以适当收取部分费用。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 160}}, {"id": "judge-160", "type": "judge", "number": 160, "text": "火灾扑灭后，发生火灾的单位和相关人员应当按照消防救援机构的要求保护现场，接受事故调查，如实提供与火灾有关的情况。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 161}}, {"id": "judge-161", "type": "judge", "number": 161, "text": "灭火器配置场所的危险等级和火灾种类均相同的相邻场所，可将一个楼层或一个防火分区作为一个计算单元。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 162}}, {"id": "judge-162", "type": "judge", "number": 162, "text": "灭火器的灭火级别应由数字和字母组成，数字表示灭火级别的大小，字母（A或B）表示灭火级别的单位及适用扑救火灾的种类。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 163}}, {"id": "judge-163", "type": "judge", "number": 163, "text": "当室外消火栓安装部位火灾时存在可能落物危险时，其上方应设有防坠落物打击的措施。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 164}}, {"id": "judge-164", "type": "judge", "number": 164, "text": "甲、乙类生产厂房、汽车库严禁采用明火采暖。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 165}}, {"id": "judge-165", "type": "judge", "number": 165, "text": "消防救援机构应当根据本地区火灾规律、特点以及结合重大节日、重大活动等消防安全需要，组织监督抽查。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 166}}, {"id": "judge-166", "type": "judge", "number": 166, "text": "公众聚集场所对员工的消防安全培训应当至少每年进行一次，培训的内容还应当主要针对报火警、扑救初起火灾以及自救逃生的知识和技能。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 167}}, {"id": "judge-167", "type": "judge", "number": 167, "text": "建设工程中用于消防安全的建筑防火构（配）件和设备也是消防产品。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 168}}, {"id": "judge-168", "type": "judge", "number": 168, "text": "消防产品现场检查使用的仪器设备无需校准和计量。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 169}}, {"id": "judge-169", "type": "judge", "number": 169, "text": "国家规定相关消防产品必须经过认证的，应当经过认证并标注认证标志后，方可出厂、销售、进口或者在其他经营活动中使用。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 170}}, {"id": "judge-170", "type": "judge", "number": 170, "text": "消防产品属于公共安全类产品。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 171}}, {"id": "judge-171", "type": "judge", "number": 171, "text": "疏散通道、安全出口可以设置必要的防火门，但严禁安装铁栅栏。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 172}}, {"id": "judge-172", "type": "judge", "number": 172, "text": "宾馆饭店中厨房的油锅、抽风管道油垢过热起火也能引起火灾。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 173}}, {"id": "judge-173", "type": "judge", "number": 173, "text": "根据病人需要，可以在病房内使用明火烘烤衣物。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 174}}, {"id": "judge-174", "type": "judge", "number": 174, "text": "医院为方便病人设置的加热食品的炉灶，必须统一设在固定的安全地点，并设专人管理。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 175}}, {"id": "judge-175", "type": "judge", "number": 175, "text": "消防监督检查时如果发现公共娱乐场所窗户被封堵、遮挡或装设了铁栅栏，必须采取有力措施，督促整改。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 176}}, {"id": "judge-176", "type": "judge", "number": 176, "text": "公共娱乐场所的窗户在保证通风的前提下，可以装设铁栅栏，但应加强管理。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 177}}, {"id": "judge-177", "type": "judge", "number": 177, "text": "检查时发现公共娱乐场所从业人员不具有正确报火警、扑救初起火灾、引导在场群众疏散的技能，应给予口头警告。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 178}}, {"id": "judge-178", "type": "judge", "number": 178, "text": "宾馆、饭店的灭火、疏散预案等应由当地消防救援机构制定，各单位负责组织员工演练。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 179}}, {"id": "judge-179", "type": "judge", "number": 179, "text": "化学性质相抵触或灭火方法不同的易燃易爆化学物品，可以在同一库房内分间储存。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 180}}, {"id": "judge-180", "type": "judge", "number": 180, "text": "易燃易爆化学物品仓库内应当设值班休息室。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 181}}, {"id": "judge-181", "type": "judge", "number": 181, "text": "易燃易爆化学物品储存、经营场所不准设置移动式照明灯具。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 182}}, {"id": "judge-182", "type": "judge", "number": 182, "text": "《消防监督检查规定》不适用于公安派出所依法对单位遵守消防法律、法规情况进行的消防监督检查。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 183}}, {"id": "judge-183", "type": "judge", "number": 183, "text": "任何单位和个人都有保护消防设施、预防火灾、报告火警的义务；发现消防安全违法行为，有权劝阻、举报和投诉。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 184}}, {"id": "judge-184", "type": "judge", "number": 184, "text": "任何单位和公民都有参加灭火工作的义务。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 185}}, {"id": "judge-185", "type": "judge", "number": 185, "text": "消防安全重点单位有参加消防公益捐赠等公益活动的义务。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 186}}, {"id": "judge-186", "type": "judge", "number": 186, "text": "建设工程施工现场，施工单位不得在尚未竣工的建筑物内设置员工集体宿舍。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 187}}, {"id": "judge-187", "type": "judge", "number": 187, "text": "消防控制室应当二十四小时有操作人员值守，及时处理报警信号。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 188}}, {"id": "judge-188", "type": "judge", "number": 188, "text": "任何单位、人员都应当无偿为报火警提供便利，不得阻拦报警。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 189}}, {"id": "judge-189", "type": "judge", "number": 189, "text": "公众聚集场所在营业期间的防火巡查应当至少每个小时一次。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 190}}, {"id": "judge-190", "type": "judge", "number": 190, "text": "消防产品必须符合国家标准；没有国家标准的，必须符合行业标准。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 191}}, {"id": "judge-191", "type": "judge", "number": 191, "text": "消防救援机构对流通领域的消防产品质量实施监督管理。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 192}}, {"id": "judge-192", "type": "judge", "number": 192, "text": "消防产品，是指专门用于火灾预防、灭火救援和火灾防护、避难、逃生的产品。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 193}}, {"id": "judge-193", "type": "judge", "number": 193, "text": "依法实行强制性产品认证的消防产品，由具有法定资质的认证机构按照国家标准、行业标准的强制性要求认证合格后，方可生产、销售、使用。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 194}}, {"id": "judge-194", "type": "judge", "number": 194, "text": "人员密集场所室内装修、装饰，应当按照消防技术标准的要求，使用不燃、难燃材料。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 195}}, {"id": "judge-195", "type": "judge", "number": 195, "text": "灭火器可以倒置开启和使用。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 196}}, {"id": "judge-196", "type": "judge", "number": 196, "text": "充装量大于2kg（L）的灭火器应配有喷射软管。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 197}}, {"id": "judge-197", "type": "judge", "number": 197, "text": "推车式灭火器在喷射软管末端，宜装有可间歇喷射的喷射枪。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 198}}, {"id": "judge-198", "type": "judge", "number": 198, "text": "推车式二氧化碳灭火器不需安装超压保护装置。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 199}}, {"id": "judge-199", "type": "judge", "number": 199, "text": "消防水泵接合器应具有安全排放﹑止回﹑截断等功能。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 200}}, {"id": "judge-200", "type": "judge", "number": 200, "text": "消防水枪作跌落试验后，不应出现破裂现象且能正常操作使用。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 201}}, {"id": "judge-201", "type": "judge", "number": 201, "text": "消防应急灯具在主电源切断后10s内应能转入应急状态。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 202}}, {"id": "judge-202", "type": "judge", "number": 202, "text": "消防电话不属于火灾报警设备。", "options": {"A": "正确", "B": "错误"}, "answer": ["B"], "source": {"sheet": "判断题（203题）", "row": 203}}, {"id": "judge-203", "type": "judge", "number": 203, "text": "“中国消防产品信息网”是应急管理部消防救援局向社会统一公开发布消防产品信息的网站。", "options": {"A": "正确", "B": "错误"}, "answer": ["A"], "source": {"sheet": "判断题（203题）", "row": 204}}]};

</script>
  <script>
(() => {
  'use strict';
  const bank = window.QUESTION_BANK.questions;
  const labels = {single:'单选题',multiple:'多选题',judge:'判断题'};
  const tips = {single:'单选题每题只有一个正确答案，选择后点击「提交答案」。',multiple:'多选题有多个正确答案。全部选对才算正确，多选、漏选均为错误。',judge:'判断说法是否正确，选择「正确」或「错误」后提交。'};
  const $ = id => document.getElementById(id);
  const escape = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let type = 'all', order = 'ordered', queue = [...bank], index = 0;
  // Only this open page holds selections. No login, server writes or persistent tracking.
  const responses = new Map();
  const current = () => queue[index];
  const response = () => responses.get(current().id) || {selected:[],status:null};
  const exact = (a,b) => a.length === b.length && [...a].sort().join('') === [...b].sort().join('');
  function shuffle(items) {
    for (let i=items.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [items[i],items[j]]=[items[j],items[i]]; }
    return items;
  }
  function rebuild() {
    queue=bank.filter(q=>type==='all'||q.type===type);
    if(order==='random') shuffle(queue);
    index=0;
    render();
  }
  function render() {
    const q=current(), r=response(), locked=!!r.status;
    $('question').innerHTML=`<div class="question-meta"><div class="question-label"><span class="type-badge">${labels[q.type]}</span><span class="question-number">原题 ${String(q.number).padStart(3,'0')}</span></div><span>选择${q.type==='multiple'?'所有':'一个'}正确答案</span></div><h2 class="question-text">${escape(q.text)}</h2><div class="options ${q.type}" role="group" aria-label="答案选项">${Object.entries(q.options).map(([key,value])=>{
      const selected=r.selected.includes(key), correct=locked&&q.answer.includes(key), wrong=locked&&selected&&!q.answer.includes(key);
      return `<button class="option${selected?' selected':''}${correct?' correct':''}${wrong?' wrong':''}" data-key="${key}" aria-pressed="${selected}" ${locked?'disabled':''}><span class="option-letter">${key}</span><span class="option-text">${escape(value)}</span>${correct?'<span class="option-mark" aria-label="标准答案">✓</span>':wrong?'<span class="option-mark" aria-label="错误选项">×</span>':''}</button>`;
    }).join('')}</div><p class="selection-hint">${q.type==='multiple'?'可选择多项，选好后统一提交。':'选择后提交，即可核对答案。'}</p>`;
    $('check').hidden=locked;
    $('reveal').hidden=locked;
    $('check').disabled=r.selected.length===0;
    document.querySelector('.question-actions').hidden=locked;
    $('feedback').hidden=!locked;
    if(locked) {
      const correct=r.status==='correct', revealed=r.status==='revealed';
      $('feedback').className=revealed?'revealed':correct?'':'incorrect';
      const selectedText=r.selected.length?r.selected.join('、'):'未选择';
      $('feedback').innerHTML=`<div class="feedback-title">${revealed?'已显示标准答案':correct?'✓ 回答正确':'本题回答有误'}</div><div class="answer-line">标准答案：<strong>${q.answer.join('、')}</strong>${!revealed?'　你的选择：'+selectedText:''}</div><div class="answer-detail">${q.answer.map(a=>escape(a+'．'+q.options[a])).join('<br>')}</div><div class="feedback-note">${q.type==='multiple'?'多选题按全部选对计分。 ':''}原题库未提供解析。</div><button id="retry" class="text-button">重新作答</button>`;
    }
    $('position').textContent=`${index+1} / ${queue.length}`;
    $('prev').disabled=index===0;
    $('next').disabled=index===queue.length-1;
    $('jump').max=queue.length;
    $('jump').value=index+1;
    $('range-hint').textContent=`当前范围 1–${queue.length} 题`;
    $('type-tip').textContent=tips[q.type];
    document.querySelectorAll('[data-type]').forEach(b=>{ const active=b.dataset.type===type; b.classList.toggle('active',active); b.setAttribute('aria-pressed',active); });
    $('order').value=order;
  }
  function choose(key) {
    const q=current(), r=response();
    if(r.status||!(key in q.options)) return;
    const selected=q.type==='multiple'?(r.selected.includes(key)?r.selected.filter(x=>x!==key):[...r.selected,key].sort()):[key];
    responses.set(q.id,{selected,status:null});
    render();
    document.querySelector(`[data-key="${key}"]`)?.focus({preventScroll:true});
  }
  function check(reveal=false) {
    const q=current(),r=response();
    if(r.status||(!reveal&&!r.selected.length))return;
    responses.set(q.id,{selected:r.selected,status:reveal?'revealed':exact(r.selected,q.answer)?'correct':'incorrect'});
    render();
    $('next').focus({preventScroll:true});
  }
  function move(delta) {
    const next=index+delta;
    if(next<0||next>=queue.length)return;
    index=next;render();
    // Keep a long question's answer area from hiding the following question on phones.
    if(document.querySelector('.question-card').getBoundingClientRect().top<0)document.querySelector('.toolbar').scrollIntoView({behavior:'instant',block:'start'});
  }
  $('question').addEventListener('click',e=>{const b=e.target.closest('[data-key]');if(b)choose(b.dataset.key);});
  $('check').addEventListener('click',()=>check());
  $('reveal').addEventListener('click',()=>check(true));
  $('feedback').addEventListener('click',e=>{if(e.target.closest('#retry')){responses.delete(current().id);render();}});
  $('prev').addEventListener('click',()=>move(-1));
  $('next').addEventListener('click',()=>move(1));
  $('order').addEventListener('change',e=>{order=e.target.value;rebuild();});
  document.querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>{type=b.dataset.type;rebuild();}));
  $('jump-form').addEventListener('submit',e=>{e.preventDefault();const n=Number($('jump').value);if(Number.isInteger(n)&&n>=1&&n<=queue.length){index=n-1;render();$('jump').blur();}});
  document.addEventListener('keydown',e=>{
    if(e.ctrlKey||e.metaKey||e.altKey||e.shiftKey||e.repeat)return;
    if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;
    if(/^[1-6]$/.test(e.key)){e.preventDefault();choose(String.fromCharCode(64+Number(e.key)));}
    if(e.key==='ArrowLeft'){e.preventDefault();move(-1);}
    if(e.key==='ArrowRight'){e.preventDefault();move(1);}
    if(e.key==='Enter'){
      const focused=document.activeElement;
      if(focused?.closest('button')&&!focused.matches('[data-key],#check,#next'))return;
      if(focused?.matches('summary'))return;
      // Native button Enter must not also fire a second action after the DOM changes.
      e.preventDefault();
      if(response().status)move(1);else check();
    }
  });
  render();
})();

</script>
</body>
</html>
